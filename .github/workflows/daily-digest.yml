name: Digest quotidien VIE / IT

on:
  schedule:
    # 6h00 UTC = 7h00 (hiver) / 8h00 (été) heure de Paris.
    # Ajuste si tu veux une autre heure : https://crontab.guru
    - cron: "0 6 * * *"
  workflow_dispatch: {} # permet de le lancer manuellement depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour committer data/seen.json à jour

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lancer le script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: npm start

      - name: Sauvegarder l'état (offres déjà vues)
        run: |
          git config user.name "vie-it-watcher-bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore: update seen offers"
          git push
